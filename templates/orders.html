<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DMA | Order Intelligence</title>

<!-- DMA Login Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════════
   DMA TOKEN SYSTEM — exact match to login page
═══════════════════════════════════════════════ */
:root {
    --forest-deepest: #060F0C;
    --forest-deep:    #0A1F1A;
    --forest-mid:     #132B23;
    --emerald:        #34D399;
    --emerald-dim:    #1A8C62;
    --emerald-lt:     #D1FAE5;
    --gold:           #A3E635;
    --gold-dim:       #84cc16;
    --paper:          #F4F9F6;
    --paper-2:        #E8F4EE;
    --ink:            #0A1F1A;
    --ink-2:          #1F4038;
    --ink-3:          #5A8C78;
    --card:           #FFFFFF;
    --line:           #C5DFD4;
    --line-dim:       rgba(52,211,153,0.15);
    --success:        #1A8C62;
    --success-lt:     #D1FAE5;
    --warning:        #F59E0B;
    --warning-lt:     #FEF3C7;
    --danger:         #EF4444;
    --danger-lt:      #FEE2E2;
    --text-on-dark:   rgba(255,255,255,0.92);
    --text-dim:       rgba(255,255,255,0.22);
    --radius:         8px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; min-height: 100%; }

body {
    font-family: 'DM Sans', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    padding: 0;
    line-height: 1.5;
}

/* ═══════════════════════════════════════════════
   TOP BAR — mirrors login page right-panel accent
═══════════════════════════════════════════════ */
.topbar {
    position: sticky;
    top: 0; z-index: 100;
    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(20px) saturate(1.3);
    border-bottom: 1px solid var(--line);
    padding: 0 40px;
    height: 62px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    overflow: hidden;
}

/* Shimmer accent bar — from login .panel-right::before */
.topbar::before {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--emerald-dim), var(--emerald), var(--gold-dim), var(--emerald));
    background-size: 200% 100%;
    animation: shimmer 4s linear infinite;
}
@keyframes shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}

/* Animated grid lines — from login .panel-left::before */
.topbar::after {
    content: '';
    position: absolute; inset: 0;
    background-image:
        linear-gradient(rgba(52,211,153,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(52,211,153,0.025) 1px, transparent 1px);
    background-size: 48px 48px;
    animation: gridDrift 24s linear infinite;
    pointer-events: none;
}
@keyframes gridDrift {
    0%   { background-position: 0 0; }
    100% { background-position: 48px 48px; }
}

/* Brand — same octagon mark from login */
.brand {
    display: flex; align-items: center; gap: 12px;
    position: relative; z-index: 1;
    text-decoration: none;
}
.brand-mark {
    width: 36px; height: 36px;
    border: 1px solid var(--emerald-dim);
    display: flex; align-items: center; justify-content: center;
    clip-path: polygon(10% 0%,90% 0%,100% 10%,100% 90%,90% 100%,10% 100%,0% 90%,0% 10%);
    background: rgba(26,140,98,0.08);
    flex-shrink: 0;
}
.brand-mark span {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem; font-weight: 700;
    color: var(--emerald-dim); line-height: 1;
}
.brand-text .name {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.75rem; font-weight: 600;
    color: var(--ink);
    letter-spacing: 0.08em; text-transform: uppercase;
}
.brand-text .sub {
    font-family: 'DM Mono', monospace;
    font-size: 0.44rem; color: var(--ink-3);
    letter-spacing: 0.14em; text-transform: uppercase;
    margin-top: 1px;
}

/* Live status pill */
.live-pill {
    position: relative; z-index: 1;
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 7px 14px;
    border-radius: 100px;
    display: flex; align-items: center; gap: 8px;
    font-family: 'DM Mono', monospace;
    font-size: 0.52rem; font-weight: 500;
    color: var(--ink-3);
    text-transform: uppercase; letter-spacing: 0.12em;
    white-space: nowrap;
    transition: border-color 0.2s;
}
.live-pill:hover { border-color: var(--emerald-dim); }
.pulse-dot {
    width: 7px; height: 7px;
    background: var(--emerald);
    border-radius: 50%;
    box-shadow: 0 0 8px rgba(52,211,153,0.7);
    animation: pulse 2s ease-in-out infinite;
    flex-shrink: 0;
}
@keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.45; transform: scale(0.72); }
}

/* ═══════════════════════════════════════════════
   PAGE CONTENT
═══════════════════════════════════════════════ */
.content { padding: 32px 40px 56px; }

@keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* ── Page heading — editorial Cormorant style */
.page-heading {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 26px;
    opacity: 0;
    animation: rise 0.7s 0.1s ease forwards;
}
.page-heading-left {}
.page-kicker {
    font-family: 'DM Mono', monospace;
    font-size: 0.5rem; color: var(--emerald-dim);
    text-transform: uppercase; letter-spacing: 0.22em;
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 5px;
}
.page-kicker::before { content: ''; width: 18px; height: 1px; background: var(--emerald-dim); }

/* h1 — replaces original h1, same editorial voice */
h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.5rem; font-weight: 700;
    color: var(--ink); line-height: 1;
    letter-spacing: -0.01em;
}
h1 em { font-style: italic; color: var(--emerald-dim); }

/* ═══════════════════════════════════════════════
   KPI CARDS — white with colored top accent border
═══════════════════════════════════════════════ */
.kpi-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 24px;
    opacity: 0;
    animation: rise 0.7s 0.2s ease forwards;
}

.kpi-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px 20px 18px;
    position: relative;
    overflow: hidden;
    transition: box-shadow 0.2s, transform 0.2s;
}
/* Top accent stripe — DMA login card style */
.kpi-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0;
    height: 2px;
}
.kpi-card:nth-child(1)::before { background: linear-gradient(90deg, var(--emerald-dim), var(--emerald)); }
.kpi-card:nth-child(2)::before { background: linear-gradient(90deg, var(--success), #34D399); }
.kpi-card:nth-child(3)::before { background: linear-gradient(90deg, var(--warning), #FCD34D); }

.kpi-card::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, transparent 60%, rgba(52,211,153,0.03) 100%);
    pointer-events: none;
}
.kpi-card:hover {
    box-shadow: 0 6px 24px rgba(10,31,26,0.08);
    transform: translateY(-3px);
}

.kpi-card .label {
    font-family: 'DM Mono', monospace;
    font-size: 0.5rem;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--ink-3);
    margin-bottom: 10px;
}

.kpi-card .val {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.6rem; font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--ink); line-height: 1;
}
/* Keep original inline colour overrides working */
.kpi-card .val[style*="success"],
#delivered { color: var(--success) !important; }
#pending   { color: var(--warning) !important; }

/* ═══════════════════════════════════════════════
   TABLE
═══════════════════════════════════════════════ */
.table-container {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    opacity: 0;
    animation: rise 0.7s 0.35s ease forwards;
    /* Subtle shimmer top edge */
    position: relative;
}
.table-container::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--emerald-dim), var(--emerald), var(--gold-dim), var(--emerald));
    background-size: 200% 100%;
    animation: shimmer 5s linear infinite;
}

/* Table header — DMA editorial mono style */
table {
    width: 100%;
    border-collapse: collapse;
    min-width: 700px;
}

th {
    text-align: left;
    padding: 14px 24px;
    background: var(--paper);
    color: var(--ink-3);
    font-family: 'DM Mono', monospace;
    font-size: 0.47rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    border-bottom: 1px solid var(--line);
}

td {
    padding: 15px 24px;
    border-bottom: 1px solid rgba(197,223,212,0.5);
    font-size: 0.84rem;
    color: var(--ink-2);
    white-space: nowrap;
    font-family: 'DM Sans', sans-serif;
}
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--paper); }

/* Order ID — emerald accent matching original var(--primary) usage */
td[style*="primary"],
td:first-child { color: var(--emerald-dim) !important; font-weight: 600; font-family: 'DM Mono', monospace; }

/* ── Status badges — same classes, DMA palette ── */
.status {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 10px;
    border-radius: 20px;
    font-family: 'DM Mono', monospace;
    font-size: 0.46rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.1em;
}
.status::before { content: ''; width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }

.delivered {
    background: var(--success-lt);
    color: var(--success);
}
.delivered::before { background: var(--success); }

.pending {
    background: var(--warning-lt);
    color: var(--warning);
}
.pending::before { background: var(--warning); }

.cancelled {
    background: var(--danger-lt);
    color: var(--danger);
}
.cancelled::before { background: var(--danger); }

/* ── Action buttons ── */
.btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 7px 13px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.72rem;
    font-weight: 600;
    border: 1.5px solid var(--line);
    border-radius: 5px;
    cursor: pointer;
    background: var(--paper);
    color: var(--ink-2);
    margin-right: 5px;
    transition: all 0.18s;
    letter-spacing: 0.01em;
    position: relative;
    overflow: hidden;
}
.btn::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, transparent 50%, rgba(52,211,153,0.08) 100%);
    opacity: 0; transition: opacity 0.2s;
}
.btn-view:hover {
    background: var(--card);
    border-color: var(--ink-3);
    color: var(--ink);
}
.btn-done:hover {
    background: var(--forest-deep);
    color: #fff;
    border-color: var(--forest-deep);
    box-shadow: 0 4px 12px rgba(10,31,26,0.2);
}
.btn-done:hover::before { opacity: 1; }
/* Disabled state for markDelivered() */
.btn:disabled {
    opacity: 0.35;
    background: transparent;
    cursor: default;
}

/* ═══════════════════════════════════════════════
   FOOTER STATUS BAR — login's sys-bar
═══════════════════════════════════════════════ */
.sys-bar {
    position: sticky; bottom: 0;
    background: var(--forest-deep);
    padding: 10px 40px;
    display: flex; flex-wrap: wrap;
    font-family: 'DM Mono', monospace;
    font-size: 0.48rem; color: var(--text-dim);
    border-top: 1px solid rgba(52,211,153,0.1);
    z-index: 90;
}
.sys-bar::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--emerald-dim), transparent);
    opacity: 0.35;
}
.sys-seg { padding: 0 14px; border-right: 1px solid rgba(52,211,153,0.08); }
.sys-seg:first-child { padding-left: 0; }
.sys-seg:last-child  { border-right: none; margin-left: auto; }
.sys-seg b           { color: var(--emerald); font-weight: 500; }
.sys-seg .ok         { color: #34D399; }

/* ═══════════════════════════════════════════════
   RESPONSIVE
═══════════════════════════════════════════════ */
@media (max-width: 1024px) {
    .content { padding: 24px 28px 48px; }
    .kpi-grid { gap: 14px; }
    .kpi-card .val { font-size: 2.1rem; }
}
@media (max-width: 768px) {
    .topbar  { padding: 0 20px; }
    .content { padding: 20px 16px 48px; }
    .page-heading { flex-direction: column; align-items: flex-start; gap: 10px; }
    .kpi-grid {
        grid-template-columns: 1fr;
        gap: 12px;
        margin-bottom: 20px;
    }
    .kpi-card .val { font-size: 1.8rem; }
    .sys-bar { padding: 10px 20px; }
}
@media (max-width: 480px) {
    h1 { font-size: 1.9rem; }
    .btn { padding: 6px 10px; font-size: 0.68rem; }
}
</style>
</head>

<body>

<!-- ════ TOP BAR ════ -->
<header class="topbar">
    <a class="brand" href="#">
        <div class="brand-mark"><span>D</span></div>
        <div class="brand-text">
            <div class="name">DMA Platform</div>
            <div class="sub">Digital Marketing Analytics</div>
        </div>
    </a>
    <div class="live-pill">
        <span class="pulse-dot"></span>
        Live · Bengaluru Zone · 12ms
    </div>
</header>

<!-- ════ MAIN CONTENT ════ -->
<div class="content">

    <!-- Page heading — editorial Cormorant style -->
    <div class="page-heading">
        <div class="page-heading-left">
            <div class="page-kicker">Fulfillment · Real-time</div>
            <h1>Order <em>Intelligence</em></h1>
        </div>
    </div>

    <!-- KPI GRID — same IDs, zero JS change -->
    <div class="kpi-grid">
        <div class="kpi-card">
            <div class="label">Fulfillment Queue</div>
            <div class="val" id="totalOrders">0</div>
        </div>
        <div class="kpi-card">
            <div class="label">Completed</div>
            <div class="val" id="delivered">0</div>
        </div>
        <div class="kpi-card">
            <div class="label">Processing</div>
            <div class="val" id="pending">0</div>
        </div>
    </div>

    <!-- TABLE — same id, same structure, zero JS change -->
    <div class="table-container">
        <table id="ordersTable">
            <thead>
                <tr>
                    <th>Order Ref</th>
                    <th>Product</th>
                    <th>Qty</th>
                    <th>Total Val</th>
                    <th>Status</th>
                    <th>Execution</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

</div>

<!-- ════ FOOTER STATUS BAR ════ -->
<div class="sys-bar">
    <div class="sys-seg">SYS <b>v2.4.1</b></div>
    <div class="sys-seg">STATUS <b class="ok">ONLINE</b></div>
    <div class="sys-seg">TLS <b>1.3</b></div>
    <div class="sys-seg">LATENCY <b>12ms</b></div>
    <div class="sys-seg">NODES <b>247</b></div>
    <div class="sys-seg">LAST SYNC <b>00:00:42 AGO</b></div>
</div>

<!-- ════ ALL ORIGINAL JS — COMPLETELY UNCHANGED ════ -->
<script>
/* ---------------- STATE (UNCHANGED) ---------------- */
const State = {
    orders:[]
};

/* ---------------- SAFE CSV LOADER ---------------- */
async function loadCSV(){
    try{
        const res = await fetch(`/static/data/orders.csv`);
        if(!res.ok){
            State.orders = [];
            render();
            return;
        }
        const text = await res.text();
        State.orders = parseCSV(text);
        render();
    }catch(e){
        State.orders = [];
        render();
    }
}

/* ---------------- SAFE PARSER ---------------- */
function parseCSV(text){
    const rows = text.trim().split("\n");
    if(rows.length < 2) return [];
    const headers = rows[0].split(",").map(h=>h.trim());
    return rows.slice(1)
        .filter(r => r.trim() !== "")
        .map(r=>{
            const values = r.split(",");
            let obj = {};
            headers.forEach((h,i)=>{
                obj[h] = (values[i] || "").trim();
            });
            return obj;
        });
}

/* ---------------- RENDER (LOGIC SAME) ---------------- */
function render(){
    const tbody = document.querySelector("#ordersTable tbody");
    tbody.innerHTML = "";

    let delivered = 0;
    let pending = 0;

    (State.orders || []).forEach(o=>{
        const status = (o.status || "pending").toLowerCase();
        if(status === "delivered") delivered++;
        if(status === "pending") pending++;

        tbody.innerHTML += `
        <tr>
            <td style="color:var(--emerald-dim); font-weight:600; font-family:'DM Mono',monospace">#${o.order_id}</td>
            <td style="font-weight:500">${o.product}</td>
            <td>${Number(o.quantity || 0)}</td>
            <td>$${Number(o.total || 0).toLocaleString()}</td>
            <td>
                <span class="status ${status}">
                    ${status}
                </span>
            </td>
            <td>
                <button class="btn btn-view" onclick="viewOrder(${o.order_id})">Inspect</button>
                <button class="btn btn-done" onclick="markDelivered(this)">Deploy</button>
            </td>
        </tr>`;
    });

    document.getElementById("totalOrders").innerText = State.orders.length;
    document.getElementById("delivered").innerText = delivered;
    document.getElementById("pending").innerText = pending;
}

/* ---------------- ACTIONS (UNCHANGED) ---------------- */
function viewOrder(id){
    alert("Accessing Data for Order #" + id);
}

function markDelivered(btn){
    btn.innerText = "Completed";
    btn.style.opacity = "0.4";
    btn.style.background = "transparent";
    btn.disabled = true;
}

/* INIT */
loadCSV();
</script>

</body>
</html>
